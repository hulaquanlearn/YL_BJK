    - data:
        code: "import re\n\ndef main(query: str) -> dict:\n    text = (query or '').strip()\n    normalized = text.lower()\n    code_match = re.search(r'(?<!\\d)(\\d{6,12})(?!\\d)', text)\n    material_code = code_match.group(1) if code_match else ''\n\n    greetings = {\n        '你好', '您好', '嗨', 'hello', 'hi', '在吗',\n        '早上好', '下午好', '晚上好', '谢谢', '感谢'\n    }\n    spare_words = [\n        '备件', '物料', '库存', '库位', '货位', '货架', '货区',\n        '规格', '型号', '编码', '品牌', '单位', '补货', '缺料',\n        '缺件', '低库存', '零库存', '安全库存', '最高库存', '在途',\n        '多少种', '易损件', '质保件', '厂家备件', '分类', '统计',\n        '清单', '汇总', '导出', '位置', '在哪里', '轴承', '皮带',\n        '链条', '密封', '阀', '电机', '减速机', '传感器', '接触器',\n        '断路器', '螺栓', '滤芯', '油封'\n    ]\n    shortage_words = [\n        '缺料', '缺件', '低库存', '零库存', '补货', '采购',\n        '短缺', '不足', '待补', '补充清单'\n    ]\n    count_words = [\n        '多少', '几种', '几类', '统计', '汇总', '合计',\n        '分类', '占比', '数量'\n    ]\n    location_words = [\n        '位置', '哪里', '在哪', '库位',\
          \ '货位', '货架',\n        '货区', '东侧', '西侧', '几层', '层数', '定位'\n    ]\n\n    if normalized in greetings or (\n        len(text) <= 8 and any(word in normalized for word in greetings)\n    ):\n        intent = 'greeting'\n    elif material_code or any(word in normalized for word in spare_words):\n        intent = 'spare_parts'\n    elif any('a' <= char.lower() <= 'z' for char in text) and len(text) <= 60:\n        intent = 'spare_parts'\n    else:\n        intent = 'restricted'\n\n    if material_code:\n        query_mode = 'location'\n    elif any(word in normalized for word in shortage_words):\n        query_mode = 'shortage'\n    elif any(word in normalized for word in count_words):\n        query_mode = 'count'\n    elif any(word in normalized for word in location_words) or material_code:\n        query_mode = 'location'\n    else:\n        query_mode = 'detail'\n\n    return {\n        'intent': intent,\n        'query_mode': query_mode,\n        'query': text,\n        'material_code':\
          \ material_code,\n        # 精确编码只检索编码，避免经济型索引被“库存/货架”等公共词干扰。\n        'search_query': material_code if material_code else text\n    }"
        code_language: python3
