    - data:
        code: "import json\nimport re\n\ndef collect_texts(value, depth=0):\n    if depth > 8 or value is None:\n        return []\n    if isinstance(value, str):\n        text = value.strip()\n        if not text:\n            return []\n        outputs = [text]\n        if text[:1] in ('{', '['):\n            try:\n                outputs.extend(collect_texts(json.loads(text), depth + 1))\n            except Exception:\n                pass\n        return outputs\n    if isinstance(value, dict):\n        outputs = []\n        priority = ('content', 'text', 'page_content', 'segment', 'metadata', 'data')\n        visited = set()\n        for key in priority:\n            if key in value:\n                outputs.extend(collect_texts(value.get(key), depth + 1))\n                visited.add(key)\n        for key, child in value.items():\n            if key not in visited:\n                outputs.extend(collect_texts(child, depth + 1))\n        return outputs\n    if isinstance(value, (list,\
          \ tuple)):\n        outputs = []\n        for child in value:\n            outputs.extend(collect_texts(child, depth + 1))\n        return outputs\n    return []\n\ndef unique_blocks(results):\n    blocks = []\n    seen = set()\n    for block in collect_texts(results):\n        normalized = block.replace('\\r\\n', '\\n').replace('\\u00a0', ' ').strip()\n        if len(normalized) < 12 or normalized in seen:\n            continue\n        seen.add(normalized)\n        blocks.append(normalized)\n    return blocks\n\ndef field(block, label, fallback='未填写'):\n    match = re.search(r'^' + re.escape(label) + r'\\s*[：:]\\s*(.+?)\\s*$', block, re.M)\n    return match.group(1).strip() if match else fallback\n\ndef snapshot_of(blocks):\n    for block in blocks:\n        value = field(block, '数据快照时间', '')\n        if value:\n            return value\n    return '知识库未标注时间'\n\ndef table_rows(block):\n    rows = []\n    for line in block.splitlines():\n        line = line.strip()\n        if\
          \ not line.startswith('|') or line.startswith('| ---'):\n            continue\n        cells = [cell.strip() for cell in line.strip('|').split('|')]\n        if cells:\n            rows.append(cells)\n    return rows\n\ndef exact_part_answer(code, blocks):\n    pattern = re.compile(r'^\\s*(?:[-*]\\s*)?物料编码\\s*[：:]\\s*' + re.escape(code) + r'\\s*$', re.M)\n    candidates = [block for block in blocks if pattern.search(block)]\n    if not candidates:\n        fragments = [block for block in blocks if code in block]\n        if fragments:\n            snapshot = snapshot_of(blocks)\n            return '\\n'.join([\n                f'数据快照：{snapshot}（非实时）', '', '⚠️ 检索结果不完整',\n                f'知识库检索到了物料编码 {code} 的关键词片段，但没有同时返回库存明细和具体位置。',\n                '请把知识库文档重新分段：分隔符改为 ---，最大长度设置为 1800～2500 tokens，重叠设为 0，然后重新测试。'\n            ])\n        return '\\n'.join([\n            '数据快照：知识库未标注时间（非实时）', '', '\U0001F50E 未找到精确记录',\n            f'本次知识库检索没有返回物料编码 {code} 的库存明细。',\n            '请确认编码无误，并检查“检索备件知识库”节点是否绑定了最新备件知识库。'\n\
          \        ])\n    labels = ('物料描述', '规格型号', '当前库存', '库存状态', '货区', '具体位置')\n    block = max(candidates, key=lambda item: (sum(label in item for label in labels), len(item)))\n    snapshot = field(block, '数据快照时间', snapshot_of(blocks))\n    return '\\n'.join([\n        f'数据快照：{snapshot}（非实时）',\n        '',\n        '\U0001F4CD 精确定位',\n        f'- 物料编码：{field(block, \"物料编码\", code)}',\n        f'- 名称：{field(block, \"物料描述\")}',\n        f'- 规格型号：{field(block, \"规格型号\")}',\n        f'- 当前库存：{field(block, \"当前库存\")}',\n        f'- 库存状态：{field(block, \"库存状态\")}',\n        f'- 货区：{field(block, \"货区\")}',\n        f'- 具体位置：{field(block, \"具体位置\")}',\n        '',\n        '方位说明：东/西侧是货物在货架上的方位；货位按南到北依次排列。'\n    ])\n\ndef main(query: str, query_mode: str, material_code: str, results: list) -> dict:\n    blocks = unique_blocks(results or [])\n    context_text = '\\n\\n---\\n\\n'.join(blocks)\n    answer = ''\n    if material_code:\n        answer = exact_part_answer(material_code, blocks)\n \
          \   return {\n        'found': 'yes' if answer else 'no',\n        'answer': answer,\n        'context_text': context_text\n    }"
        code_language: python3
