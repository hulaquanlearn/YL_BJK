<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">浏览和处理 FlexPendant</span> - <span class="parent-title-last">Main menu</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel"><span class="ui-reference">Calibration（校准）</span></span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">选项：水平仪校准</span></td><td align="left" class="block-firstbodycol"><p class="normal"><span xmlns:xlink="http://www.w3.org/1999/xlink" class="ui-reference">Calibration（校准）</span>菜单用于校准机器人系统中的机械装置。可使用 <span class="notranslate"><span class="italic">Calibration Pendulum</span></span> 选项执行校准。请参阅<i>操作员手册</i> - <i>Calibration Pendulum</i>。</p></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel"><span xmlns:xlink="http://www.w3.org/1999/xlink" class="ui-reference">Calibration（校准）</span>菜单图示</span></td><td align="left" class="block-bodycol"><p class="normal">下图展示了 <span xmlns:xlink="http://www.w3.org/1999/xlink" class="ui-reference">Calibration（校准）</span>菜单。菜单中列出了所有机械装置，<span xmlns:xlink="http://www.w3.org/1999/xlink" class="ui-reference">Status（状态）</span>栏显示的是它们的校准状态。</p><div class="figure"><img src="images/en0400001146_zh-cn-618316-891.gif"/></div></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel"><span xmlns:xlink="http://www.w3.org/1999/xlink" class="ui-reference">Calibration（校准）</span>菜单选项</span></td><td align="left" class="block-
