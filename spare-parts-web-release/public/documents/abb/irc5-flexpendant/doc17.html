<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title-last">欢迎使用 IRC5</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">关于本章</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">概述</span></td><td align="left" class="block-firstbodycol"><p class="normal">本章介绍了FlexPendant、IRC5控制器和RobotStudio。</p><p class="normal">基础机器人由机器人控制器、FlexPendant、RobotStudio和一个或几个机械手或其它机械单元组成。可能还含有工艺设备和其它可选软件。</p><p class="normal">本手册描述的是不包含可选件的基础机器人。但在某些地方，手册概述了如何使用或应用可选件。大部分可选件的应用手册中都有详细说明。</p></td></tr></table></body></html>
