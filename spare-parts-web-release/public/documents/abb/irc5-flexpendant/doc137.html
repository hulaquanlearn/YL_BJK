<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">在生产模式下运行</span> - <span class="parent-title-last">操作模式</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">从自动模式切换到手动模式 </span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">从自动模式切换到手动模式</span></td><td align="left" class="block-firstbodycol"><table xmlns:xlink="http://www.w3.org/1999/xlink" type="proc-set;" width="100%" class="ordinary-table"><col width="5.050505%"/><col width="47.474747%"/><col width="47.474747%"/><thead><tr class="table-header"><td class="ordinary-col"/><td class="ordinary-col"><p class="normal">操作</p></td><td class="ordinary-col"><p class="normal">Information</p></td></tr></thead><tbody><tr><td class="ordinary-col"><p class="normal"><span class="counter">1</span></p></td><td class="ordinary-col"><p class="normal">将模式开关置于手动位置。</p></td><td class="ordinary-col"><div class="figure"><img src="images/xx0300000468-45282-186.png"/></div></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">2</span></p></td><td class="ordinary-col"><div class="question"><p class="normal">系统是否已正常切换模式？</p></div><div class="if-yes"><p class="normal">如果是，操作完成。</p></div><div class="if-no"><p class="normal">如果否，请查明错误。</p></div></td><td class="ordinary-col"><p class="normal">有关错误处理的详细信息，请参见<span><i>操作员手册</i> - <i>IRC5故障排除</i></span>。</p></td></tr></tbody></table><table><tr><td class="signal-symbolcol"><img align="left" style="height: 10m
