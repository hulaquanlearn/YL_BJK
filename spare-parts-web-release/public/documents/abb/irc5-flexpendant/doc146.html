<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title-last">处理输入和输出，I/O</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">查看信号组 </span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">查看信号组</span></td><td align="left" class="block-firstbodycol"><p class="normal">本节详细介绍如何查看信号组。</p><table xmlns:xlink="http://www.w3.org/1999/xlink" type="proc-set;" width="100%" class="ordinary-table"><col width="5.0251255%"/><col width="94.97488%"/><thead><tr class="table-header"><td class="ordinary-col"/><td class="ordinary-col"><p class="normal">操作</p></td></tr></thead><tbody><tr><td class="ordinary-col"><p class="normal"><span class="counter">1</span></p></td><td class="ordinary-col"><p class="normal">在 <span class="bold">ABB</span> 菜单中，点击 <span class="ui-reference"><span class="bold">I/O</span></span>。</p><div class="response"><p class="normal">显示常用信号列表。请参见<a href="doc67.html">配置常用 I/O</a>一节。</p></div></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">2</span></p></td><td class="ordinary-col"><p class="normal">在 <span class="ui-reference"><span class="bold">View（视图）</span></span> 菜单中，点击 <span class="ui-reference"><span class="bold">Groups（组）</span></span>。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">3</span></p></td><td class="ordinary-col"><p class="normal">点击列表中的信号组名称，然后点击 。或点击两次信号组的名称。</p><div class="response"><p class="normal">显示信号组的属性。</p></div></td></tr></tbody></table></td></tr></table></body></html>
