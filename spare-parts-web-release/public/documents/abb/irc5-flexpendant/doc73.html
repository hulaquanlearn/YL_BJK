<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title-last">微动控制</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">控制杆方向</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">控制杆方向简介</span></td><td align="left" class="block-firstbodycol"><p class="normal"><span xmlns:xlink="http://www.w3.org/1999/xlink" class="ui-reference">控制杆方向（控制杆方向）</span>系统的轴。</p></td></tr><tr><td class="block-labelcol"/><td align="left" class="block-bodycol"><table><tr><td class="signal-symbolcol"><img align="left" style="height: 10mm; width: 10mm" src="Graphics/caution.png"/></td><td class="signal-bodycol"><p class="caution">小心</p><p class="normal">"方向"属性不会显示机械单元将要移动的方向。请始终通过控制杆微小移动来进行微动控制，以便了解机械单元的真实方向。</p></td></tr></table></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">控制杆方向 </span></td><td align="left" class="block-bodycol"><p class="normal">控制杆方向的含义取决于选定的动作模式。</p><table xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" type="" class="ordinary-table"><col width="23.232323%"/><col width="38.38384%"/><col width="38.38384%"/><thead><tr class="table-header"><td class="ordinary-col"><p class="normal">动作模式</p></td><td class="ordinary-col"><p class="normal">控制杆图示</p></td><td class="ordinary-col"><p class="normal">描述</p></td></tr></thead><tbody><tr><td class="ordinary-col"><p class="normal">线性</p></td><td class="ordinary-col"><div class="figure"><img src="images/en0400001131_zh-cn-618286-224.gif"/></div></td><td class="ordinary-col"><p class="normal">有关线性模式的说明，请参阅 <a href="doc79.html">设置工具方向 </a> 一节。</p></td></tr><tr><td class="ordinary-col"><p class="normal">轴 1、2 和 3</p><p class="normal">（机器人默认值）</p></td><td class="ordinary-col"><div class="figure"><img src="images/en0300000536_zh-cn-617685-0.gif"/></div></td><td class="ordinary-col"><p class="normal">有关轴 1-3 模式的说明，请参阅<a href="doc80.html">逐轴微动控制</a>一节。</p></td></tr><tr><td class="ordinary-col"><p class="normal">轴 4、5 和 6</p></td><td class="ordinary-col"><div class="figure"><img src="images/en0300000537_zh-cn-617700-0.gif"/></div></td><td class="ordinary-col"><p class="normal">有关轴 4-6 模式的说明，请参阅<a href="doc80.html">逐轴微动控制</a>一节。</p></td></tr><tr><td class="ordinary-col"><p class="normal">重定向</p></td><td class="ordinary-col"><div class="figure"><img src="images/en0400001131_zh-cn-618286-224.gif"/></div></td><td class="ordinary-col"><p class="normal">有关重定向模式的说明，请参阅 <a href="doc79.html">设置工具方向 </a> 一节。</p></td></tr></tbody></table></td></tr></table></body></html>
