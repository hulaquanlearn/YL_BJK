
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">微动控制</span> - <span class="parent-title-last">微动控制基本设置</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">对准工具 </span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">概述</span></td><td align="left" class="block-firstbodycol"><p class="normal">工具可用其它坐标系对准。</p><p class="normal">对准工具时，工具的z轴应该对准选定坐标系最近的轴。因此建议首先将工具移到靠近所需坐标的位置。</p><p class="normal">注意工具数据不可更改！</p></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">对准机械单元</span></td><td align="left" class="block-bodycol"><p class="normal">本步骤介绍如何对准工具。</p><table xmlns:xlink="http://www.w3.org/1999/xlink" type="proc-set;" width="100%" class="ordinary-table"><col width="5.0251255%"/><col width="94.97488%"/><thead><tr class="table-header"><td class="ordinary-col"/><td class="ordinary-col"><p class="normal">操作</p></td></tr></thead><tbody><tr><td class="ordinary-col"><p class="normal"><span class="counter">1</span></p></td><td class="ordinary-col"><p class="normal">在 <span class="bold">ABB</span> 菜单中，点击 <span class="ui-reference"><span class="bold">Jogging（微动控制）</span></span>。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">2</span></p></td><td class="ordinary-col"><p class="normal">确保启动正确工具，然后点击 <span class="ui-reference"><span class="bold">Align...(对准...）</span></span>。</p><div class="response"><div class="figure"><img src="images/en0500001548_zh-cn-618421-534.gif"/></div></div></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">3</span></p></td><td class="ordinary-col"><p class="normal">选择与选定工具对准的坐标系.</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">4</span></p></td><td class="ordinary-col"><p class="normal">按住三位使动装置，然后点按<span class="ui-reference"><span class="bold">开始对准</span></span>开始对准工具。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">5</span></p></td><td class="ordinary-col"><p class="normal">完成时点击 <span class="ui-reference"><span class="bold">Close（关闭）</span></span>。</p></td></tr></tbody></table></td></tr></table></body></html>
