<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">浏览和处理 FlexPendant</span> - <span class="parent-title-last">快速设置</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">Quickset（快速设置）菜单，<span class="ui-reference">Run Mode（运行模式）</span></span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">运行模式</span></td><td align="left" class="block-firstbodycol"><p class="normal">通过设置运行模式，您可以定义程序执行一次就停止，也可以定义程序持续运行。</p><p class="normal">有关：</p><ul class="unorderedList"><li><p class="normal"><span class="notranslate"><span class="italic">Multitasking</span></span>，请参阅<span><i>应用手册</i> - <i>控制器软件IRC5</i></span>，<span class="notranslate"><span class="italic">Multitasking</span></span>一节</p></li><li><p class="normal"><span class="notranslate"><span class="italic">MultiMove</span></span>，请参阅 <i>应用手册</i> - <i>MultiMove</i><span class="italic">Multimove 专用用户界面</span>一节。</p></li></ul></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">运行模式图示</span></td><td align="left" class="block-bodycol"><div class="figure"><img src="images/en0300000472_zh-cn-617625-534.gif"/><table xmlns:xlink="http://www.w3.org/1999/xlink" type="GraphicDescription;" width="100%" class="ordinary-table"><col width="17.857143%"/><col width="82.14285%"/><tbody><tr><td class="ordinary-col"><p class="normal"><span class="ui-reference">Single Cycle（单循环）</span></p></td><td class="ordinary-col"><p class="normal">运行一次循环然后停止执行。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="ui-reference">Continuous（连续）</span></p></td><td class="ordinary-col"><p class="normal">连续运行。</p></td></tr></tbody></table></div></td></tr></table></body></html>
