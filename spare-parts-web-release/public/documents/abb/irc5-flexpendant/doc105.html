
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">编程和测试</span> - <span class="parent-title-last">工件</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">什么是工件？</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">图示</span></td><td align="left" class="block-firstbodycol"><div class="figure"><img src="images/en0400000819-64421-545.png"/></div></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">描述</span></td><td align="left" class="block-bodycol"><p class="normal">工件是拥有特定附加属性的坐标系。它主要用于简化编程（因置换特定任务和工件进程等而需要编辑程序时）。</p><p class="normal">工件坐标系必须定义于两个框架：用户框架（与大地基座相关）和工件框架（与用户框架相关）.</p><p class="normal">创建工件可用于简化对工件表面的微动控制。可以创建若干不同的工件，这样，您就必须选择一个用于微动控制的工件。</p><p class="normal">使用夹具时，有效载荷是一个重要因素。为了尽可能精确地定位和操纵工件，必须考虑工件重量。您必须选择一个用于微动控制。</p></td></tr></table></body></html>
