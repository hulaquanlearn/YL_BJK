
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">安全</span> - <span class="parent-title-last">安全操作</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">停止系统</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">概述</span></td><td align="left" class="block-firstbodycol"><p class="normal">出现下列情况时请立即按下任意紧急停止按钮：</p><ul class="unorderedList"><li><p class="normal">操纵器运行时，机器人操纵器区域内有工作人员。</p></li><li><p class="normal">操纵器伤害了工作人员或损伤了机器设备。</p></li></ul></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">控制器紧急停止按钮</span></td><td align="left" class="block-bodycol"><p class="normal">控制器上的紧急停止按钮位于机柜的前面。 但是，它可随您的工厂设计而变化。</p><p class="normal">FlexPendan也设有紧急停止按钮。</p></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">其它紧急停止设备</span></td><td align="left" class="block-bodycol"><p class="normal">工厂设计者应该在合适的位置放置其它的紧急停止设备。有关这些设备的摆放位置，请参阅工厂或车间的说明文档。</p></td></tr></table></body></html>
