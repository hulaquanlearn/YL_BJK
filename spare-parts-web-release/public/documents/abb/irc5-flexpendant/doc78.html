
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">微动控制</span> - <span class="parent-title-last">微动控制基本设置</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">选择工具、工件和有效载荷 </span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">概述</span></td><td align="left" class="block-firstbodycol"><p class="normal">请始终选择合适的工具、工件或有效载荷。当通过移到目标位置来创建程序时，这显得尤为关键。</p><p class="normal">如果没有选择合适的工具、工件或有效载荷，当进行微动控制或在生产过程中运行该程序时，很可能会出现过载错误和/或定位错误。</p></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">选择工具、工件和有效载荷</span></td><td align="left" class="block-bodycol"><table xmlns:xlink="http://www.w3.org/1999/xlink" type="proc-set;" width="100%" class="ordinary-table"><col width="5.0251255%"/><col width="94.97488%"/><thead><tr class="table-header"><td class="ordinary-col"/><td class="ordinary-col"><p class="normal">操作</p></td></tr></thead><tbody><tr><td class="ordinary-col"><p class="normal"><span class="counter">1</span></p></td><td class="ordinary-col"><p class="normal">在 <span class="bold">ABB</span> 菜单中、选择 <span class="ui-reference">Jogging（微动控制）</span>可查看微动控制属性。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">2</span></p></td><td class="ordinary-col"><p class="normal">点击<span class="ui-reference">工具</span>、<span class="ui-reference">工件</span>或<span class="ui-reference">有效载荷</span>，可显示可用工具、工件或有效载荷列表。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">3</span></p></td><td class="ordinary-col"><p class="normal">点击选定的工具、工件或有效载荷，然后点击 <span class="bold">确定</span> 。</p></td></tr></tbody></table></td></tr></table></body></html>
