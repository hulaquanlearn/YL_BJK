<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">安全</span> - <span class="parent-title-last">安全操作</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">灭火</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">注意</span></td><td align="left" class="block-firstbodycol"><p class="normal">发生火灾时，请确保全体人员安全撤离后再行灭火。如有人受伤，应首先处理伤员。</p></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">选择灭火器</span></td><td align="left" class="block-bodycol"><p class="normal">当电气设备（例如机器人或控制器）起火时，使用二氧化碳灭火器。切勿使用水或泡沫。</p></td></tr></table></body></html>
