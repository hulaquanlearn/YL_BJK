
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">浏览和处理 FlexPendant</span> - <span class="parent-title-last">基本步骤</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">滚屏和缩放</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">概述</span></td><td align="left" class="block-firstbodycol"><p class="normal">一个屏幕不一定能显示所要查看的全部内容。 要查看全部内容，您可以：</p><ul class="unorderedList"><li><p class="normal">向上／向下滚动（有时是向左／向右）</p></li><li><p class="normal">放大或缩小（仅在 <span xmlns:xlink="http://www.w3.org/1999/xlink" class="ui-reference">Program Editor（程序编辑器）</span>中可用）</p></li></ul><div class="figure"><img src="images/en0400000685_zh-cn-617868-604.gif"/><table xmlns:xlink="http://www.w3.org/1999/xlink" type="GraphicDescription;" width="100%" class="ordinary-table"><col width="11.538462%"/><col width="88.46154%"/><tbody><tr><td class="ordinary-col"><p class="normal">A</p></td><td class="ordinary-col"><p class="normal">放大（放大文本）</p></td></tr><tr><td class="ordinary-col"><p class="normal">B</p></td><td class="ordinary-col"><p class="normal">向上滚动（滚动幅度为一<span class="italic">页</span>）</p></td></tr><tr><td class="ordinary-col"><p class="normal">C</p></td><td class="ordinary-col"><p class="normal">向上滚动（滚动幅度为一<span class="italic">行</span>）</p></td></tr><tr><td class="ordinary-col"><p class="normal">D</p></td><td class="ordinary-col"><p class="normal">向左滚动</p></td></tr><tr><td class="ordinary-col"><p class="normal">E</p></td><td class="ordinary-col"><p class="normal">向右滚动</p></td></tr><tr><td class="ordinary-col"><p class="normal">F</p></td><td class="ordinary-col"><p class="normal">缩小（缩小文本）</p></td></tr><tr><td class="ordinary-col"><p class="normal">G</p></td><td class="ordinary-col"><p class="normal">向下滚动（滚动幅度为一<span class="italic">页</span>）</p></td></tr><tr><td class="ordinary-col"><p class="normal">H</p></td><td class="ordinary-col"><p class="normal">向下滚动（滚动幅度为一<span class="italic">行</span>）</p></td></tr></tbody></table></div></td></tr></table></body></html>
