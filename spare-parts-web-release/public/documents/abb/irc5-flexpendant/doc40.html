
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title-last">浏览和处理 FlexPendant</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">操作员窗口</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">操作员窗口</span></td><td align="left" class="block-firstbodycol"><p class="normal">操作员窗口显示来自程序的信息。 装有 <span class="notranslate"><span class="italic">Multitasking</span></span> 后，所有任务信息均显示于同一操作员窗口。 如果有消息要求执行动作，就会显示该任务的独立窗口。</p><p class="normal">点击状态栏中 ABB 标识右侧图标，即可打开操作员窗口。以下图示显示了操作员窗口的一个例子：</p><div class="figure"><img src="images/en0400000975_zh-cn-618226-604.gif"/><table xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" type="" class="ordinary-table"><col span="1"/><col span="1"/><tbody><tr><td class="ordinary-col"><p class="normal"><span class="ui-reference">Clear（清除）</span></p></td><td class="ordinary-col"><p class="normal">清除所有消息</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="ui-reference">Don’t Show Logs（不显示日志）</span></p></td><td class="ordinary-col"><p class="normal">清除所有消息</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="ui-reference">Don’t Show Task Name（不显示任务名）</span></p></td><td class="ordinary-col"><p class="normal">隐藏任务名</p></td></tr></tbody></table></div></td></tr></table></body></html>
