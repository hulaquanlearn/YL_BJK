
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">编程和测试</span> - <span class="parent-title-last">有效载荷</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">编辑有效载荷声明 </span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">概述</span></td><td align="left" class="block-firstbodycol"><p class="normal">使用声明来改变有效载荷变量在程序模块中的使用方法。</p></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">显示有效载荷声明</span></td><td align="left" class="block-bodycol"><table xmlns:xlink="http://www.w3.org/1999/xlink" type="proc-set;" width="100%" class="ordinary-table"><col width="5.0251255%"/><col width="94.97488%"/><thead><tr class="table-header"><td class="ordinary-col"/><td class="ordinary-col"><p class="normal">操作</p></td></tr></thead><tbody><tr><td class="ordinary-col"><p class="normal"><span class="counter">1</span></p></td><td class="ordinary-col"><p class="normal">在 <span class="bold">ABB</span> 菜单中，点击 <span class="ui-reference">Jogging（微动控制）</span>。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">2</span></p></td><td class="ordinary-col"><p class="normal">点击 <span class="ui-reference">Payload（有效载荷）</span>查看可用有效载荷的列表。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">3</span></p></td><td class="ordinary-col"><p class="normal">选择您想要编辑的有效载荷，然后点击 <span class="ui-reference">Edit（编辑）</span>。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">4</span></p></td><td class="ordinary-col"><p class="normal">在菜单中，点击 <span class="ui-reference">Change declaration（更改声明）</span>。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">5</span></p></td><td class="ordinary-col"><p class="normal">显示有效载荷的声明。请参阅 <a href="doc111.html">创建有效载荷 </a> 。</p></td></tr></tbody></table></td></tr><tr><td class="block-labelcol"/><td align="left" class="block-bodycol"><table><tr><td class="signal-symbolcol"><img align="left" style="height: 10mm; width: 10mm" src="Graphics/note.png"/></td><td class="signal-bodycol"><p class="note">注意</p><p class="normal">如果在任何程序中关联某一有效载荷后需更改该有效载荷的名称，则必须同时更改该有效载荷名称的所有具体值。</p></td></tr></table></td></tr></table></body></html>
