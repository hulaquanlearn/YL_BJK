<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title-last">处理事件日志</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">访问事件日志</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">事件日志</span></td><td align="left" class="block-firstbodycol"><p class="normal">打开事件日志：</p><ul class="unorderedList"><li><p class="normal">查看所有当前项目。</p></li><li><p class="normal">详细研究特定项目。</p></li><li><p class="normal">处理日志项目，如保存或删除。</p></li></ul><p class="normal">日志可以使用 RobotStudio 打印。</p></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">打开和关闭事件日志</span></td><td align="left" class="block-bodycol"><p class="normal">本节详细介绍如何打开事件日志。</p><table xmlns:xlink="http://www.w3.org/1999/xlink" type="proc-set;" width="100%" class="ordinary-table"><col width="5.0251255%"/><col width="94.97488%"/><thead><tr class="table-header"><td class="ordinary-col"/><td class="ordinary-col"><p class="normal">操作</p></td></tr></thead><tbody><tr><td class="ordinary-col"><p class="normal"><span class="counter">1</span></p></td><td class="ordinary-col"><p class="normal">点击状态栏。</p><div class="response"><p class="normal">显示状态窗口。</p></div></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">2</span></p></td><td class="ordinary-col"><p class="normal">点击 <span class="ui-reference">Event Log（事件日志）</span>。</p><div class="response"><p class="normal">事件日志列表显示。</p></div></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">3</span></p></td><td class="ordinary-col"><p class="normal">如果日志内容无法在一个屏幕中显示，可以通过滚动来显示。</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">4</span></p></td><td class="ordinary-col"><p class="normal">点击日志项目查看事件消息.</p></td></tr><tr><td class="ordinary-col"><p class="normal"><span class="counter">5</span></p></td><td class="ordinary-col"><p class="normal">再次点击状态栏关闭日志。</p></td></tr></tbody></table></td></tr><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">相关信息</span></td><td align="left" class="block-bodycol"><p class="normal"><span><i>操作员手册</i> - <i>RobotStudio</i></span>。</p></td></tr></table></body></html>
