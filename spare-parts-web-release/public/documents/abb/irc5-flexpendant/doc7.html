<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title">安全</span> - <span class="parent-title-last">安全操作</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">确保主电源已经关闭！</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel">描述</span></td><td align="left" class="block-firstbodycol"><p class="normal">高压作业可能会产生致命性后果。触碰高压可能会导致心跳停顿、烧伤或其它严重伤害。为避免这些伤害，请务必在作业前关闭控制器主电源。</p><table><tr><td class="signal-symbolcol"><img align="left" style="height: 10mm; width: 10mm" src="Graphics/note.png"/></td><td class="signal-bodycol"><p class="note">注意</p><p class="normal">关闭MultiMove系统内的所有主电源开关。</p></td></tr></table></td></tr></table></body></html>
