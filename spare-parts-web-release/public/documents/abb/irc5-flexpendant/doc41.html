
<!DOCTYPE html

<html><head><META xmlns:xlink="http://www.w3.org/1999/xlink" content="text/html; charset=utf-8" http-equiv="Content-Type"/><link href="CSS/ABBContent.css" type="text/css" rel="stylesheet"/></head><body><table xmlns:xlink="http://www.w3.org/1999/xlink" border="0" class="map-header" width="100%"><tr><td width="80%"><span class="parent-title-last">浏览和处理 FlexPendant</span></td><td width="12%"><BR/></td><td width="8%"><BR/></td></tr><tr><td width="80%"><span class="maplabel">状态栏</span></td></tr><tr><td width="80%"><span class="italic"/></td></tr></table><table border="0" width="100%" class="StatusSecrecy"><tr><td> </td></tr></table><table border="0" width="95%"><tr><td nowrap="true" valign="top" align="left" class="block-labelcol"><span class="blocklabel"><a xmlns:xlink="http://www.w3.org/1999/xlink" name="newid-26"/>状态栏图示</span></td><td align="left" class="block-firstbodycol"><p class="normal">状态栏  会显示当前状态的相关信息，例如操作模式、系统、活动机械单元。</p><div class="figure"><img src="images/en0300000490_zh-cn-617655-604.gif"/></div><table xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" type="" class="ordinary-table"><col width="5.0251255%"/><col width="94.97488%"/><tbody><tr><td class="ordinary-col"><p class="normal">A</p></td><td class="ordinary-col"><p class="normal">操作员窗口</p></td></tr><tr><td class="ordinary-col"><p class="normal">B</p></td><td class="ordinary-col"><p class="normal">操作模式</p></td></tr><tr><td class="ordinary-col"><p class="normal">C</p></td><td class="ordinary-col"><p class="normal">系统名称（和控制器名称）</p></td></tr><tr><td class="ordinary-col"><p class="normal">D</p></td><td class="ordinary-col"><p class="normal">控制器状态</p></td></tr><tr><td class="ordinary-col"><p class="normal">E</p></td><td class="ordinary-col"><p class="normal">程序状态</p></td></tr><tr><td class="ordinary-col"><p class="normal">F</p></td><td class="ordinary-col"><p class="normal">机械单元。选定单元（以及与选定单元协调的任何单元）以边框标记。活动单元显示为彩色，而未启动单元则呈灰色。</p></td></tr></tbody></table></td></tr></table></body></html>
