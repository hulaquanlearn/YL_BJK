<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>参考模型验收</title>
<style>body{margin:0;background:#edf1f5;color:#172033;font-family:system-ui}header{padding:16px 24px}h1{font-size:22px;margin:0}p{font-size:13px;color:#64748b}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 20px 20px}article{background:white;border:1px solid #dbe2e9;border-radius:12px;overflow:hidden}h2{font-size:16px;margin:12px}canvas{width:100%;height:240px;display:block}img{width:100%;height:150px;object-fit:contain;border-top:1px solid #e5eaf0}small{display:block;padding:8px 12px;color:#64748b}</style>
<header><h1>七类备件模型 · 参考图对照</h1><p>上方为可旋转的 GLB，下方为用户原图。示意模型不代表实际尺寸或精确型号。</p></header><main></main>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const base='/models/reference-20260904/';const manifest=await(await fetch(base+'manifest.json')).json();
for(const entry of manifest.models){const card=document.createElement('article');const heading=document.createElement('h2');heading.textContent=entry.name;card.append(heading);document.querySelector('main').append(card);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(card.clientWidth,240);r.setClearColor(0xf5f7fa);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.1;card.append(r.domElement);const s=new T.Scene();const pm=new T.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),.04).texture;const camera=new T.PerspectiveCamera(36,card.clientWidth/240,.01,100);const controls=new OrbitControls(camera,r.domElement);const gltf=await new GLTFLoader().loadAsync(base+entry.model);s.add(gltf.scene);const b=new T.Box3().setFromObject(gltf.scene),c=b.getCenter(new T.Vector3()),sz=b.getSize(new T.Vector3()),d=Math.max(sz.x,sz.y,sz.z)*2.15;camera.position.copy(c).add(new T.Vector3(1,.65,1.6).normalize().multiplyScalar(d));controls.target.copy(c);controls.enableDamping=true;controls.update();r.setAnimationLoop(()=>{controls.update();r.render(s,camera)});const img=document.createElement('img');img.src=base+entry.image;img.alt=entry.name+'参考图';card.append(img);const status=document.createElement('small');status.textContent='已加载 · 拖动旋转 / 滚轮缩放';card.append(status)}
</script></html>
